name: CI — Backend Security Suite

# EPIC-SEC Fase 2: run the full backend test suite (incl. the IDOR signature guard
# SEC-ADMIN-6 and the SEC-SCOPE-7 role contract) on every PR and on pushes to main.
# A red suite BLOCKS the merge — this is the gate that turns the pointwise IDOR /
# authz fixes into a standing CI invariant.
#
# The suite is fully in-process: it uses the FakeSupabaseClient + TestClient harness
# (SEC-ADMIN-1) and never touches a real database, Supabase, or the network. No
# secrets are required.

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  security-suite:
    name: pytest (security + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full backend test suite (no network / no DB)
        # The harness sets a strong dev JWT secret + ENVIRONMENT=development and
        # overrides the Supabase dependency with the in-memory fake, so the boot
        # guard passes without any real key. Disable Sentry to keep CI logs clean.
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-strong-secret-key-that-is-long-enough-xxxx
          SENTRY_DSN: ""
        run: |
          python -m pytest tests/ -q
